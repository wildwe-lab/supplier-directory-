name: Backend Deploy

permissions:
  id-token: write
  contents: read

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Debug OIDC claims
        shell: bash
        run: |
          RESPONSE=$(curl -sSf \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com")

          TOKEN=$(echo "$RESPONSE" | python3 -c 'import json,sys; print(json.load(sys.stdin)["value"])')
          export TOKEN

          python3 - <<'PY'
          import os
          import json
          import base64

          token = os.environ["TOKEN"]
          payload = token.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))

          for key in ("sub", "aud", "repository", "ref", "job_workflow_ref"):
              print(f"{key}: {claims.get(key)}")
          PY

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::637423389066:role/supplier-directory-github-actions-role
          aws-region: ap-northeast-3

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build backend Docker image
        run: docker build -t supplier-directory-project-backend ./backend

      - name: Tag backend Docker image
        run: |
          docker tag supplier-directory-project-backend:latest 637423389066.dkr.ecr.ap-northeast-3.amazonaws.com/supplier-directory-project-backend:${{ github.sha }}
          docker tag supplier-directory-project-backend:latest 637423389066.dkr.ecr.ap-northeast-3.amazonaws.com/supplier-directory-project-backend:latest

      - name: Push backend Docker image to ECR
        run: |
          docker push 637423389066.dkr.ecr.ap-northeast-3.amazonaws.com/supplier-directory-project-backend:${{ github.sha }}
          docker push 637423389066.dkr.ecr.ap-northeast-3.amazonaws.com/supplier-directory-project-backend:latest

      - name: Deploy backend to ECS
        run: |
          aws ecs update-service \
            --cluster supplier-cluster \
            --service supplier-directory-project-backend \
            --force-new-deployment \
            --region ap-northeast-3